<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Costs Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            padding: 20px;
            color: #1d1d1f;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.07);
            padding: 40px;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            color: #86868b;
            margin-bottom: 32px;
            font-size: 17px;
            font-weight: 400;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #86868b;
            font-size: 17px;
        }
        
        .error {
            background: #fff5f5;
            border: 1px solid #ffebee;
            padding: 16px 20px;
            border-radius: 12px;
            color: #d32f2f;
            margin-bottom: 24px;
            font-size: 15px;
        }
        
        .matrix-view {
            overflow-x: auto;
            margin-bottom: 32px;
            -webkit-overflow-scrolling: touch;
        }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            font-size: 15px;
        }
        
        th, td {
            padding: 14px 16px;
            text-align: center;
            border-bottom: 1px solid #e5e5e7;
        }
        
        th {
            background: #f5f5f7;
            color: #1d1d1f;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        th:first-child {
            border-radius: 12px 0 0 0;
            text-align: left;
            padding-left: 20px;
        }
        
        th:last-child {
            border-radius: 0 12px 0 0;
        }
        
        td {
            font-size: 15px;
        }
        
        td.positive {
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: 600;
        }
        
        td.negative {
            background: #ffebee;
            color: #c62828;
            font-weight: 600;
        }
        
        td.zero {
            background: #fafafa;
            color: #bdbdbd;
        }
        
        td.diagonal {
            background: #e0e0e0;
            color: #9e9e9e;
        }
        
        .row-header {
            background: #f5f5f7;
            font-weight: 600;
            text-align: left !important;
            padding-left: 20px !important;
            color: #1d1d1f;
        }
        
        .table-helper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        
        .table-label {
            font-size: 13px;
            color: #86868b;
            font-weight: 500;
        }
        
        .table-label.from-label {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            position: absolute;
            left: -20px;
            top: 50%;
        }
        
        .selector-section {
            background: #f5f5f7;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 32px;
        }
        
        .selector-section label {
            display: block;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 12px;
            font-size: 15px;
        }
        
        select {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        
        select:focus {
            outline: none;
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0,113,227,0.1);
        }
        
        .personal-view {
            display: none;
            background: #fafafa;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 32px;
        }
        
        .personal-view h2 {
            color: #1d1d1f;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 600;
        }
        
        .debt-list {
            list-style: none;
        }
        
        .debt-item {
            padding: 14px 16px;
            margin-bottom: 8px;
            background: white;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e5e5e7;
        }
        
        .debt-item.positive {
            background: #e8f5e9;
            border-color: #c8e6c9;
        }
        
        .debt-item.negative {
            background: #ffebee;
            border-color: #ffcdd2;
        }
        
        .debt-name {
            font-weight: 500;
            color: #1d1d1f;
            font-size: 15px;
        }
        
        .debt-amount {
            font-size: 17px;
            font-weight: 600;
        }
        
        .debt-amount.positive {
            color: #2e7d32;
        }
        
        .debt-amount.negative {
            color: #c62828;
        }
        
        .breakdown-list {
            list-style: none;
            margin-top: 8px;
            padding-left: 0;
        }
        
        .breakdown-item {
            font-size: 13px;
            color: #86868b;
            padding: 4px 0;
            display: flex;
            justify-content: space-between;
        }
        
        .breakdown-text {
            color: #6e6e73;
        }
        
        .breakdown-amount {
            font-weight: 600;
            margin-left: 8px;
        }
        
        .breakdown-amount.positive {
            color: #2e7d32;
        }
        
        .breakdown-amount.negative {
            color: #c62828;
        }
        
        .total-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e5e5e7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 19px;
            font-weight: 600;
        }
        
        .refresh-btn {
            background: #0071e3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        
        .refresh-btn:hover {
            background: #0077ed;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,113,227,0.3);
        }
        
        .refresh-btn:active {
            transform: translateY(0);
        }
        
        .last-updated {
            color: #86868b;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 24px 20px;
            }
            
            h1 {
                font-size: 28px;
            }
            
            table {
                font-size: 13px;
            }
            
            th, td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏖️ Holiday Costs Tracker</h1>
        <p class="subtitle">Who owes whom?</p>
        
        <div id="loading" class="loading">
            Loading data from Google Sheets...
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="content" style="display: none;">
            <div id="matrixView" class="matrix-view"></div>
            
            <div class="selector-section">
                <label for="personSelect">View individual balance:</label>
                <select id="personSelect">
                    <option value="">-- Select a person --</option>
                </select>
            </div>
            
            <div id="personalView" class="personal-view"></div>
            
            <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>
            <div class="last-updated" id="lastUpdated"></div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1Hx37RxUhdUhLHY5uzf9IXW5biMhzU-toOBiQqVemkXE';
        
        // MANUAL NAME CONFIGURATION
        // Uncomment the line below and add names in the EXACT order they appear in columns E-K
        // Example: const MANUAL_NAMES = ['Andrew', 'Stefan', 'Ross', 'Sam', 'Natalie', 'Aimee', 'Nicole'];
        const MANUAL_NAMES = null; // Set to null to use automatic detection
        
        let expensesData = [];
        let paymentsData = [];
        let names = [];
        let owedMatrix = {};

        async function fetchSheetData(sheetName, range = '') {
            const rangeParam = range ? `&range=${range}` : '';
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${sheetName}${rangeParam}&headers=1`;
            
            try {
                const response = await fetch(url);
                const text = await response.text();
                
                // Google's response is wrapped in a function call, extract the JSON
                const jsonString = text.match(/google\.visualization\.Query\.setResponse\((.*)\);/)[1];
                const data = JSON.parse(jsonString);
                
                // Extract headers from the cols metadata
                const headers = data.table.cols.map(col => col.label || col.id || null);
                
                // Extract data rows
                const dataRows = data.table.rows.map(row => 
                    row.c.map(cell => cell ? cell.v : null)
                );
                
                // Return both headers and data
                return { headers, dataRows };
            } catch (error) {
                console.error(`Error fetching ${sheetName}:`, error);
                throw error;
            }
        }

        function parseExpenses(data) {
            if (!data || !data.dataRows || data.dataRows.length === 0) return;
            
            const headers = data.headers;
            const dataRows = data.dataRows;
            
            // Find column indices
            const byIndex = 0; // Column A
            const poundsIndex = 2; // Column C
            const costEachIndex = 11; // Column L
            
            // Use manual names if provided
            if (MANUAL_NAMES && MANUAL_NAMES.length > 0) {
                names = MANUAL_NAMES;
            } else {
                // Try to get names from headers E-K (indices 4-10)
                const headerNames = headers.slice(4, 11).filter(n => n && n !== true && n !== false && typeof n === 'string');
                
                // If headers have actual names, use them
                if (headerNames.length > 0) {
                    names = headerNames;
                } else {
                    // Otherwise, extract unique names from the "By" column
                    const uniqueNames = new Set();
                    dataRows.forEach(row => {
                        if (row[byIndex]) uniqueNames.add(row[byIndex]);
                    });
                    names = Array.from(uniqueNames).sort();
                }
            }
            
            // Parse expense data
            const parsedExpenses = dataRows.map((row, index) => ({
                rowNumber: index + 2, // +2 because row 1 is headers, row 2 is first data
                by: row[byIndex],
                pounds: row[poundsIndex],
                checkboxes: row.slice(4, 11),
                costEach: row[costEachIndex]
            }));
            
            expensesData = parsedExpenses.filter(item => item.by && item.costEach);
            
            // Log warning if rows were filtered out (data quality issue)
            const filteredOut = parsedExpenses.filter(item => !item.by || !item.costEach);
            if (filteredOut.length > 0) {
                console.warn(`⚠️ ${filteredOut.length} expense row(s) skipped due to missing data`);
            }
        }

        function parsePayments(data) {
            if (!data || !data.dataRows || data.dataRows.length === 0) return;
            
            const dataRows = data.dataRows;
            
            paymentsData = dataRows.map(row => ({
                from: row[0], // Column A
                to: row[1],   // Column B
                amount: row[2] // Column C
            })).filter(item => item.from && item.to && item.amount);
        }

        function calculateOwedMatrix() {
            owedMatrix = {};
            
            // Initialize matrix
            names.forEach(fromPerson => {
                owedMatrix[fromPerson] = {};
                names.forEach(toPerson => {
                    owedMatrix[fromPerson][toPerson] = 0;
                });
            });
            
            // Calculate expenses in both directions
            expensesData.forEach(expense => {
                const payer = expense.by;
                
                names.forEach((person, index) => {
                    const isLiable = expense.checkboxes[index];
                    
                    if (isLiable === true && expense.costEach > 0) {
                        // Person owes payer
                        if (!owedMatrix[person]) owedMatrix[person] = {};
                        if (!owedMatrix[person][payer]) owedMatrix[person][payer] = 0;
                        owedMatrix[person][payer] += expense.costEach;
                    }
                });
            });
            
            // Net out bidirectional debts
            names.forEach(person1 => {
                names.forEach(person2 => {
                    if (person1 !== person2) {
                        const person1OwesPerson2 = owedMatrix[person1][person2];
                        const person2OwesPerson1 = owedMatrix[person2][person1];
                        
                        if (person1OwesPerson2 > person2OwesPerson1) {
                            owedMatrix[person1][person2] = person1OwesPerson2 - person2OwesPerson1;
                            owedMatrix[person2][person1] = 0;
                        } else {
                            owedMatrix[person2][person1] = person2OwesPerson1 - person1OwesPerson2;
                            owedMatrix[person1][person2] = 0;
                        }
                    }
                });
            });
            
            // Subtract payments made
            paymentsData.forEach(payment => {
                const from = payment.from;
                const to = payment.to;
                const amount = payment.amount;
                
                if (owedMatrix[from] && owedMatrix[from][to] !== undefined) {
                    owedMatrix[from][to] -= amount;
                }
            });
        }

        function renderMatrix() {
            let html = '<div class="table-helper">';
            html += '<span class="table-label">↓ FROM (owes) / TO (is owed) →</span>';
            html += '</div>';
            html += '<table><thead><tr><th>FROM ↓ / TO →</th>';
            
            names.forEach(name => {
                html += `<th>${name}</th>`;
            });
            
            html += '</tr></thead><tbody>';
            
            names.forEach(fromPerson => {
                html += `<tr><td class="row-header">${fromPerson}</td>`;
                
                names.forEach(toPerson => {
                    if (fromPerson === toPerson) {
                        html += `<td class="diagonal">—</td>`;
                    } else {
                        const amount = owedMatrix[fromPerson][toPerson];
                        let className = 'zero';
                        let displayAmount = '—';
                        
                        if (amount > 0.01) {
                            className = 'negative';
                            displayAmount = `£${amount.toFixed(2)}`;
                        } else if (amount < -0.01) {
                            className = 'positive';
                            displayAmount = `—`;
                        }
                        
                        html += `<td class="${className}">${displayAmount}</td>`;
                    }
                });
                
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            
            document.getElementById('matrixView').innerHTML = html;
        }

        function calculateBreakdown(person1, person2) {
            // Calculate expenses person1 paid for person2
            let person1PaidForPerson2 = 0;
            expensesData.forEach(expense => {
                if (expense.by === person1) {
                    const person2Index = names.indexOf(person2);
                    if (person2Index !== -1 && expense.checkboxes[person2Index] === true) {
                        person1PaidForPerson2 += expense.costEach;
                    }
                }
            });
            
            // Calculate expenses person2 paid for person1
            let person2PaidForPerson1 = 0;
            expensesData.forEach(expense => {
                if (expense.by === person2) {
                    const person1Index = names.indexOf(person1);
                    if (person1Index !== -1 && expense.checkboxes[person1Index] === true) {
                        person2PaidForPerson1 += expense.costEach;
                    }
                }
            });
            
            // Calculate payments person1 made to person2
            let person1PaidPerson2 = 0;
            paymentsData.forEach(payment => {
                if (payment.from === person1 && payment.to === person2) {
                    person1PaidPerson2 += payment.amount;
                }
            });
            
            // Calculate payments person2 made to person1
            let person2PaidPerson1 = 0;
            paymentsData.forEach(payment => {
                if (payment.from === person2 && payment.to === person1) {
                    person2PaidPerson1 += payment.amount;
                }
            });
            
            return {
                person1PaidForPerson2,
                person2PaidForPerson1,
                person1PaidPerson2,
                person2PaidPerson1
            };
        }

        function renderPersonalView(person) {
            if (!person) {
                document.getElementById('personalView').style.display = 'none';
                document.getElementById('matrixView').style.display = 'block';
                return;
            }
            
            document.getElementById('matrixView').style.display = 'none';
            document.getElementById('personalView').style.display = 'block';
            
            let html = `<h2>${person}'s Balance</h2><ul class="debt-list">`;
            let totalOwed = 0;
            let totalDue = 0;
            
            names.forEach(otherPerson => {
                if (otherPerson === person) return;
                
                const personOwesOther = owedMatrix[person][otherPerson];
                const otherOwesPerson = owedMatrix[otherPerson][person];
                
                // Get breakdown data
                const breakdown = calculateBreakdown(person, otherPerson);
                
                // Determine the net relationship
                const netAmount = otherOwesPerson - personOwesOther;
                let itemClass = 'debt-item';
                let displayText = '';
                let amountText = '';
                let amountClass = '';
                
                if (Math.abs(netAmount) < 0.01) {
                    // Settled/balanced
                    itemClass = 'debt-item';
                    displayText = `${otherPerson}`;
                    amountText = 'Settled ✓';
                    amountClass = 'debt-amount';
                } else if (netAmount > 0) {
                    // Other person owes you
                    itemClass = 'debt-item positive';
                    displayText = `${otherPerson} owes you`;
                    amountText = `£${otherOwesPerson.toFixed(2)}`;
                    amountClass = 'debt-amount positive';
                    totalDue += otherOwesPerson;
                } else {
                    // You owe other person
                    itemClass = 'debt-item negative';
                    displayText = `Owes ${otherPerson}`;
                    amountText = `£${personOwesOther.toFixed(2)}`;
                    amountClass = 'debt-amount negative';
                    totalOwed += personOwesOther;
                }
                
                html += `
                    <li class="${itemClass}">
                        <div style="width: 100%;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span class="debt-name">${displayText}</span>
                                <span class="${amountClass}">${amountText}</span>
                            </div>
                            <ul class="breakdown-list">
                `;
                
                // Always show breakdown if there's any activity
                let hasActivity = false;
                
                if (breakdown.person1PaidForPerson2 > 0) {
                    html += `
                        <li class="breakdown-item">
                            <span class="breakdown-text">You spent on ${otherPerson}</span>
                            <span class="breakdown-amount positive">£${breakdown.person1PaidForPerson2.toFixed(2)}</span>
                        </li>
                    `;
                    hasActivity = true;
                }
                
                if (breakdown.person2PaidForPerson1 > 0) {
                    html += `
                        <li class="breakdown-item">
                            <span class="breakdown-text">${otherPerson} spent on you</span>
                            <span class="breakdown-amount negative">£${breakdown.person2PaidForPerson1.toFixed(2)}</span>
                        </li>
                    `;
                    hasActivity = true;
                }
                
                if (breakdown.person1PaidPerson2 > 0) {
                    html += `
                        <li class="breakdown-item">
                            <span class="breakdown-text">You paid ${otherPerson}</span>
                            <span class="breakdown-amount positive">£${breakdown.person1PaidPerson2.toFixed(2)}</span>
                        </li>
                    `;
                    hasActivity = true;
                }
                
                if (breakdown.person2PaidPerson1 > 0) {
                    html += `
                        <li class="breakdown-item">
                            <span class="breakdown-text">${otherPerson} paid you</span>
                            <span class="breakdown-amount positive">£${breakdown.person2PaidPerson1.toFixed(2)}</span>
                        </li>
                    `;
                    hasActivity = true;
                }
                
                if (!hasActivity) {
                    html += `
                        <li class="breakdown-item">
                            <span class="breakdown-text" style="color: #bdbdbd;">No transactions</span>
                        </li>
                    `;
                }
                
                html += `
                            </ul>
                        </div>
                    </li>
                `;
            });
            
            html += '</ul>';
            
            const netBalance = totalDue - totalOwed;
            
            if (Math.abs(netBalance) > 0.01) {
                const netClass = netBalance > 0 ? 'positive' : 'negative';
                const netText = netBalance > 0 ? 'Net Balance (you receive)' : 'Net Balance (you pay)';
                html += `
                    <div class="total-section">
                        <span>${netText}:</span>
                        <span class="debt-amount ${netClass}">£${Math.abs(netBalance).toFixed(2)}</span>
                    </div>
                `;
            } else {
                html += `
                    <div class="total-section">
                        <span>Net Balance:</span>
                        <span class="debt-amount">£0.00 (all settled)</span>
                    </div>
                `;
            }
            
            document.getElementById('personalView').innerHTML = html;
        }

        function populateDropdown() {
            const select = document.getElementById('personSelect');
            
            // Clear existing options except the first one (the placeholder)
            while (select.options.length > 1) {
                select.remove(1);
            }
            
            // Add name options
            names.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
        }

        // Set up event listener ONCE on page load (outside populateDropdown)
        document.getElementById('personSelect').addEventListener('change', (e) => {
            renderPersonalView(e.target.value);
        });

        async function loadData() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('content').style.display = 'none';
                document.getElementById('error').style.display = 'none';
                
                const [expenses, payments] = await Promise.all([
                    fetchSheetData('Expenses'),
                    fetchSheetData('Payments')
                ]);
                
                parseExpenses(expenses);
                parsePayments(payments);
                calculateOwedMatrix();
                
                populateDropdown();
                renderMatrix();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                document.getElementById('lastUpdated').textContent = 
                    `Last updated: ${new Date().toLocaleString()}`;
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 
                    `Error loading data: ${error.message}. Make sure the Google Sheet is shared publicly (view-only).`;
            }
        }

        // Load data on page load
        loadData();
    </script>
</body>
</html>
