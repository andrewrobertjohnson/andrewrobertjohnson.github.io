<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Costs Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 18px;
        }
        
        .error {
            background: #fee;
            border: 1px solid #fcc;
            padding: 15px;
            border-radius: 8px;
            color: #c33;
            margin-bottom: 20px;
        }
        
        .selector-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .selector-section label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        select {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .personal-view {
            display: none;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #667eea;
        }
        
        .personal-view h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 22px;
        }
        
        .debt-list {
            list-style: none;
        }
        
        .debt-item {
            padding: 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .debt-item.positive {
            background: #d4edda;
            border-left: 4px solid #28a745;
        }
        
        .debt-item.negative {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
        }
        
        .debt-name {
            font-weight: 600;
            color: #333;
        }
        
        .debt-amount {
            font-size: 18px;
            font-weight: 700;
        }
        
        .debt-amount.positive {
            color: #28a745;
        }
        
        .debt-amount.negative {
            color: #dc3545;
        }
        
        .total-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: 700;
        }
        
        .matrix-view {
            overflow-x: auto;
            margin-top: 30px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        
        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }
        
        th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }
        
        td {
            font-size: 14px;
        }
        
        td.positive {
            background: #d4edda;
            color: #28a745;
            font-weight: 600;
        }
        
        td.negative {
            background: #f8d7da;
            color: #dc3545;
            font-weight: 600;
        }
        
        td.zero {
            background: #f8f9fa;
            color: #999;
        }
        
        .row-header {
            background: #f8f9fa;
            font-weight: 600;
            text-align: left !important;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 20px;
            transition: background 0.3s;
        }
        
        .refresh-btn:hover {
            background: #5568d3;
        }
        
        .last-updated {
            color: #999;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 8px 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏖️ Holiday Costs Tracker</h1>
        <p class="subtitle">Who owes whom?</p>
        
        <div id="loading" class="loading">
            Loading data from Google Sheets...
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="content" style="display: none;">
            <div class="selector-section">
                <label for="personSelect">Select a person to see their debts:</label>
                <select id="personSelect">
                    <option value="">-- View Full Matrix --</option>
                </select>
            </div>
            
            <div id="personalView" class="personal-view"></div>
            
            <div id="matrixView" class="matrix-view"></div>
            
            <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>
            <div class="last-updated" id="lastUpdated"></div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1Hx37RxUhdUhLHY5uzf9IXW5biMhzU-toOBiQqVemkXE';
        
        // MANUAL NAME CONFIGURATION
        // If the automatic name detection doesn't work, uncomment and fill in the line below
        // with names in the exact order they appear in columns E, F, G, H, I, J, K
        // const MANUAL_NAMES = ['Andrew', 'Stefan', 'Ross', 'Sam', 'Natalie', 'Aimee', 'Nicole'];
        const MANUAL_NAMES = null; // Set to null to use automatic detection
        
        let expensesData = [];
        let paymentsData = [];
        let names = [];
        let owedMatrix = {};

        async function fetchSheetData(sheetName) {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;
            
            try {
                const response = await fetch(url);
                const text = await response.text();
                
                // Google's response is wrapped in a function call, extract the JSON
                const jsonString = text.match(/google\.visualization\.Query\.setResponse\((.*)\);/)[1];
                const data = JSON.parse(jsonString);
                
                return data.table.rows.map(row => 
                    row.c.map(cell => cell ? cell.v : null)
                );
            } catch (error) {
                console.error(`Error fetching ${sheetName}:`, error);
                throw error;
            }
        }

        function parseExpenses(rows) {
            if (rows.length === 0) return;
            
            const headers = rows[0];
            const dataRows = rows.slice(1);
            
            console.log('Expenses Headers:', headers);
            console.log('First data row:', dataRows[0]);
            
            // Find column indices
            const byIndex = 0; // Column A
            const poundsIndex = 2; // Column C
            const costEachIndex = 11; // Column L
            
            // Use manual names if provided
            if (MANUAL_NAMES && MANUAL_NAMES.length > 0) {
                names = MANUAL_NAMES;
                console.log('Using MANUAL_NAMES:', names);
            } else {
                // Try to get names from headers E-K (indices 4-10)
                const headerNames = headers.slice(4, 11).filter(n => n && n !== true && n !== false);
                
                console.log('Header names (E1:K1):', headerNames);
                
                // If headers have actual names, use them
                if (headerNames.length > 0 && typeof headerNames[0] === 'string') {
                    names = headerNames;
                } else {
                    // Otherwise, extract unique names from the "By" column
                    const uniqueNames = new Set();
                    dataRows.forEach(row => {
                        if (row[byIndex]) uniqueNames.add(row[byIndex]);
                    });
                    names = Array.from(uniqueNames).sort();
                }
                
                console.log('Extracted names:', names);
            }
            
            expensesData = dataRows.map(row => ({
                by: row[byIndex],
                pounds: row[poundsIndex],
                checkboxes: row.slice(4, 11), // E-K columns
                costEach: row[costEachIndex]
            })).filter(item => item.by && item.costEach);
        }

        function parsePayments(rows) {
            if (rows.length === 0) return;
            
            const dataRows = rows.slice(1); // Skip header
            
            paymentsData = dataRows.map(row => ({
                from: row[0], // Column A
                to: row[1],   // Column B
                amount: row[2] // Column C
            })).filter(item => item.from && item.to && item.amount);
        }

        function calculateOwedMatrix() {
            owedMatrix = {};
            
            // Initialize matrix
            names.forEach(fromPerson => {
                owedMatrix[fromPerson] = {};
                names.forEach(owedPerson => {
                    owedMatrix[fromPerson][owedPerson] = 0;
                });
            });
            
            // Calculate expenses owed
            expensesData.forEach(expense => {
                const owedPerson = expense.by;
                
                names.forEach((fromPerson, index) => {
                    const isLiable = expense.checkboxes[index];
                    
                    if (isLiable === true && expense.costEach > 0) {
                        if (!owedMatrix[fromPerson]) owedMatrix[fromPerson] = {};
                        if (!owedMatrix[fromPerson][owedPerson]) owedMatrix[fromPerson][owedPerson] = 0;
                        owedMatrix[fromPerson][owedPerson] += expense.costEach;
                    }
                });
            });
            
            // Subtract payments made
            paymentsData.forEach(payment => {
                const from = payment.from;
                const to = payment.to;
                const amount = payment.amount;
                
                if (owedMatrix[from] && owedMatrix[from][to] !== undefined) {
                    owedMatrix[from][to] -= amount;
                }
            });
        }

        function renderMatrix() {
            let html = '<table><thead><tr><th>From / To</th>';
            
            names.forEach(name => {
                html += `<th>${name}</th>`;
            });
            
            html += '</tr></thead><tbody>';
            
            names.forEach(fromPerson => {
                html += `<tr><td class="row-header">${fromPerson}</td>`;
                
                names.forEach(owedPerson => {
                    const amount = owedMatrix[fromPerson][owedPerson];
                    let className = 'zero';
                    let displayAmount = '—';
                    
                    if (amount > 0.01) {
                        className = 'negative';
                        displayAmount = `£${amount.toFixed(2)}`;
                    } else if (amount < -0.01) {
                        className = 'positive';
                        displayAmount = `£${Math.abs(amount).toFixed(2)}`;
                    }
                    
                    html += `<td class="${className}">${displayAmount}</td>`;
                });
                
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            
            document.getElementById('matrixView').innerHTML = html;
        }

        function renderPersonalView(person) {
            if (!person) {
                document.getElementById('personalView').style.display = 'none';
                document.getElementById('matrixView').style.display = 'block';
                return;
            }
            
            document.getElementById('matrixView').style.display = 'none';
            document.getElementById('personalView').style.display = 'block';
            
            let html = `<h2>${person}'s Balance</h2><ul class="debt-list">`;
            let total = 0;
            
            names.forEach(owedPerson => {
                if (owedPerson === person) return;
                
                const amount = owedMatrix[person][owedPerson];
                
                if (Math.abs(amount) > 0.01) {
                    const isNegative = amount > 0;
                    const displayAmount = Math.abs(amount).toFixed(2);
                    const className = isNegative ? 'negative' : 'positive';
                    const prefix = isNegative ? 'owes' : 'is owed by';
                    
                    html += `
                        <li class="debt-item ${className}">
                            <span class="debt-name">${prefix} ${owedPerson}</span>
                            <span class="debt-amount ${className}">£${displayAmount}</span>
                        </li>
                    `;
                    
                    total += amount;
                }
            });
            
            if (total === 0) {
                html += '<li class="debt-item">All settled up! ✅</li>';
            }
            
            html += '</ul>';
            
            if (Math.abs(total) > 0.01) {
                const totalClass = total > 0 ? 'negative' : 'positive';
                const totalText = total > 0 ? 'Total Owed' : 'Total Due to Receive';
                html += `
                    <div class="total-section">
                        <span>${totalText}:</span>
                        <span class="debt-amount ${totalClass}">£${Math.abs(total).toFixed(2)}</span>
                    </div>
                `;
            }
            
            document.getElementById('personalView').innerHTML = html;
        }

        function populateDropdown() {
            const select = document.getElementById('personSelect');
            
            names.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
            
            select.addEventListener('change', (e) => {
                renderPersonalView(e.target.value);
            });
        }

        async function loadData() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('content').style.display = 'none';
                document.getElementById('error').style.display = 'none';
                
                const [expenses, payments] = await Promise.all([
                    fetchSheetData('Expenses'),
                    fetchSheetData('Payments')
                ]);
                
                parseExpenses(expenses);
                parsePayments(payments);
                calculateOwedMatrix();
                
                populateDropdown();
                renderMatrix();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                document.getElementById('lastUpdated').textContent = 
                    `Last updated: ${new Date().toLocaleString()}`;
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 
                    `Error loading data: ${error.message}. Make sure the Google Sheet is shared publicly (view-only).`;
            }
        }

        // Load data on page load
        loadData();
    </script>
</body>
</html>
