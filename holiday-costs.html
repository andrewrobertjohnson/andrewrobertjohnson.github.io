<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Costs Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            padding: 20px;
            color: #1d1d1f;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.07);
            padding: 40px;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            color: #86868b;
            margin-bottom: 32px;
            font-size: 17px;
            font-weight: 400;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #86868b;
            font-size: 17px;
        }
        
        .error {
            background: #fff5f5;
            border: 1px solid #ffebee;
            padding: 16px 20px;
            border-radius: 12px;
            color: #d32f2f;
            margin-bottom: 24px;
            font-size: 15px;
        }
        
        .matrix-view {
            overflow-x: auto;
            margin-bottom: 32px;
            -webkit-overflow-scrolling: touch;
        }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            font-size: 15px;
        }
        
        th, td {
            padding: 14px 16px;
            text-align: center;
            border-bottom: 1px solid #e5e5e7;
        }
        
        th {
            background: #f5f5f7;
            color: #1d1d1f;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        th:first-child {
            border-radius: 12px 0 0 0;
            text-align: left;
            padding-left: 20px;
        }
        
        th:last-child {
            border-radius: 0 12px 0 0;
        }
        
        td {
            font-size: 15px;
        }
        
        td.positive {
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: 600;
        }
        
        td.negative {
            background: #ffebee;
            color: #c62828;
            font-weight: 600;
        }
        
        td.zero {
            background: #fafafa;
            color: #bdbdbd;
        }
        
        td.diagonal {
            background: #e0e0e0;
            color: #9e9e9e;
        }
        
        .row-header {
            background: #f5f5f7;
            font-weight: 600;
            text-align: left !important;
            padding-left: 20px !important;
            color: #1d1d1f;
        }
        
        .table-helper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        
        .table-label {
            font-size: 13px;
            color: #86868b;
            font-weight: 500;
        }
        
        .table-label.from-label {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            position: absolute;
            left: -20px;
            top: 50%;
        }
        
        .selector-section {
            background: #f5f5f7;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 32px;
        }
        
        .selector-section label {
            display: block;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 12px;
            font-size: 15px;
        }
        
        select {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        
        select:focus {
            outline: none;
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0,113,227,0.1);
        }
        
        .personal-view {
            display: none;
            background: #fafafa;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 32px;
        }
        
        .personal-view h2 {
            color: #1d1d1f;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 600;
        }
        
        .debt-list {
            list-style: none;
        }
        
        .debt-item {
            padding: 14px 16px;
            margin-bottom: 8px;
            background: white;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e5e5e7;
        }
        
        .debt-item.positive {
            background: #e8f5e9;
            border-color: #c8e6c9;
        }
        
        .debt-item.negative {
            background: #ffebee;
            border-color: #ffcdd2;
        }
        
        .debt-name {
            font-weight: 500;
            color: #1d1d1f;
            font-size: 15px;
        }
        
        .debt-amount {
            font-size: 17px;
            font-weight: 600;
        }
        
        .debt-amount.positive {
            color: #2e7d32;
        }
        
        .debt-amount.negative {
            color: #c62828;
        }
        
        .total-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e5e5e7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 19px;
            font-weight: 600;
        }
        
        .refresh-btn {
            background: #0071e3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        
        .refresh-btn:hover {
            background: #0077ed;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,113,227,0.3);
        }
        
        .refresh-btn:active {
            transform: translateY(0);
        }
        
        .last-updated {
            color: #86868b;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 24px 20px;
            }
            
            h1 {
                font-size: 28px;
            }
            
            table {
                font-size: 13px;
            }
            
            th, td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏖️ Holiday Costs Tracker</h1>
        <p class="subtitle">Who owes whom?</p>
        
        <div id="loading" class="loading">
            Loading data from Google Sheets...
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="content" style="display: none;">
            <div id="matrixView" class="matrix-view"></div>
            
            <div class="selector-section">
                <label for="personSelect">View individual balance:</label>
                <select id="personSelect">
                    <option value="">-- Select a person --</option>
                </select>
            </div>
            
            <div id="personalView" class="personal-view"></div>
            
            <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>
            <div class="last-updated" id="lastUpdated"></div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1Hx37RxUhdUhLHY5uzf9IXW5biMhzU-toOBiQqVemkXE';
        
        // MANUAL NAME CONFIGURATION
        // If the automatic name detection doesn't work, uncomment and fill in the line below
        // with names in the exact order they appear in columns E, F, G, H, I, J, K
        const MANUAL_NAMES = ['Andrew', 'Stefan', 'Ross', 'Sam', 'Natalie', 'Aimee', 'Nicole'];
        // const MANUAL_NAMES = null; // Set to null to use automatic detection
        
        let expensesData = [];
        let paymentsData = [];
        let names = [];
        let owedMatrix = {};

        async function fetchSheetData(sheetName) {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;
            
            try {
                const response = await fetch(url);
                const text = await response.text();
                
                // Google's response is wrapped in a function call, extract the JSON
                const jsonString = text.match(/google\.visualization\.Query\.setResponse\((.*)\);/)[1];
                const data = JSON.parse(jsonString);
                
                return data.table.rows.map(row => 
                    row.c.map(cell => cell ? cell.v : null)
                );
            } catch (error) {
                console.error(`Error fetching ${sheetName}:`, error);
                throw error;
            }
        }

        function parseExpenses(rows) {
            if (rows.length === 0) return;
            
            const headers = rows[0];
            const dataRows = rows.slice(1);
            
            console.log('Expenses Headers:', headers);
            console.log('First data row:', dataRows[0]);
            
            // Find column indices
            const byIndex = 0; // Column A
            const poundsIndex = 2; // Column C
            const costEachIndex = 11; // Column L
            
            // Use manual names if provided
            if (MANUAL_NAMES && MANUAL_NAMES.length > 0) {
                names = MANUAL_NAMES;
                console.log('Using MANUAL_NAMES:', names);
            } else {
                // Try to get names from headers E-K (indices 4-10)
                const headerNames = headers.slice(4, 11).filter(n => n && n !== true && n !== false);
                
                console.log('Header names (E1:K1):', headerNames);
                
                // If headers have actual names, use them
                if (headerNames.length > 0 && typeof headerNames[0] === 'string') {
                    names = headerNames;
                } else {
                    // Otherwise, extract unique names from the "By" column
                    const uniqueNames = new Set();
                    dataRows.forEach(row => {
                        if (row[byIndex]) uniqueNames.add(row[byIndex]);
                    });
                    names = Array.from(uniqueNames).sort();
                }
                
                console.log('Extracted names:', names);
            }
            
            expensesData = dataRows.map(row => ({
                by: row[byIndex],
                pounds: row[poundsIndex],
                checkboxes: row.slice(4, 11), // E-K columns
                costEach: row[costEachIndex]
            })).filter(item => item.by && item.costEach);
        }

        function parsePayments(rows) {
            if (rows.length === 0) return;
            
            const dataRows = rows.slice(1); // Skip header
            
            paymentsData = dataRows.map(row => ({
                from: row[0], // Column A
                to: row[1],   // Column B
                amount: row[2] // Column C
            })).filter(item => item.from && item.to && item.amount);
        }

        function calculateOwedMatrix() {
            owedMatrix = {};
            
            // Initialize matrix
            names.forEach(fromPerson => {
                owedMatrix[fromPerson] = {};
                names.forEach(toPerson => {
                    owedMatrix[fromPerson][toPerson] = 0;
                });
            });
            
            // Calculate expenses in both directions
            expensesData.forEach(expense => {
                const payer = expense.by;
                
                names.forEach((person, index) => {
                    const isLiable = expense.checkboxes[index];
                    
                    if (isLiable === true && expense.costEach > 0) {
                        // Person owes payer
                        if (!owedMatrix[person]) owedMatrix[person] = {};
                        if (!owedMatrix[person][payer]) owedMatrix[person][payer] = 0;
                        owedMatrix[person][payer] += expense.costEach;
                    }
                });
            });
            
            // Net out bidirectional debts
            names.forEach(person1 => {
                names.forEach(person2 => {
                    if (person1 !== person2) {
                        const person1OwesPerson2 = owedMatrix[person1][person2];
                        const person2OwesPerson1 = owedMatrix[person2][person1];
                        
                        if (person1OwesPerson2 > person2OwesPerson1) {
                            owedMatrix[person1][person2] = person1OwesPerson2 - person2OwesPerson1;
                            owedMatrix[person2][person1] = 0;
                        } else {
                            owedMatrix[person2][person1] = person2OwesPerson1 - person1OwesPerson2;
                            owedMatrix[person1][person2] = 0;
                        }
                    }
                });
            });
            
            // Subtract payments made
            paymentsData.forEach(payment => {
                const from = payment.from;
                const to = payment.to;
                const amount = payment.amount;
                
                if (owedMatrix[from] && owedMatrix[from][to] !== undefined) {
                    owedMatrix[from][to] -= amount;
                }
            });
        }

        function renderMatrix() {
            let html = '<div class="table-helper">';
            html += '<span class="table-label">↓ FROM (owes) / TO (is owed) →</span>';
            html += '</div>';
            html += '<table><thead><tr><th>FROM ↓ / TO →</th>';
            
            names.forEach(name => {
                html += `<th>${name}</th>`;
            });
            
            html += '</tr></thead><tbody>';
            
            names.forEach(fromPerson => {
                html += `<tr><td class="row-header">${fromPerson}</td>`;
                
                names.forEach(toPerson => {
                    if (fromPerson === toPerson) {
                        html += `<td class="diagonal">—</td>`;
                    } else {
                        const amount = owedMatrix[fromPerson][toPerson];
                        let className = 'zero';
                        let displayAmount = '—';
                        
                        if (amount > 0.01) {
                            className = 'negative';
                            displayAmount = `£${amount.toFixed(2)}`;
                        } else if (amount < -0.01) {
                            className = 'positive';
                            displayAmount = `—`;
                        }
                        
                        html += `<td class="${className}">${displayAmount}</td>`;
                    }
                });
                
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            
            document.getElementById('matrixView').innerHTML = html;
        }

        function renderPersonalView(person) {
            if (!person) {
                document.getElementById('personalView').style.display = 'none';
                document.getElementById('matrixView').style.display = 'block';
                return;
            }
            
            document.getElementById('matrixView').style.display = 'none';
            document.getElementById('personalView').style.display = 'block';
            
            let html = `<h2>${person}'s Balance</h2><ul class="debt-list">`;
            let totalOwed = 0;
            let totalDue = 0;
            
            names.forEach(otherPerson => {
                if (otherPerson === person) return;
                
                const personOwesOther = owedMatrix[person][otherPerson];
                const otherOwesPerson = owedMatrix[otherPerson][person];
                
                if (personOwesOther > 0.01) {
                    html += `
                        <li class="debt-item negative">
                            <span class="debt-name">Owes ${otherPerson}</span>
                            <span class="debt-amount negative">£${personOwesOther.toFixed(2)}</span>
                        </li>
                    `;
                    totalOwed += personOwesOther;
                }
                
                if (otherOwesPerson > 0.01) {
                    html += `
                        <li class="debt-item positive">
                            <span class="debt-name">${otherPerson} owes you</span>
                            <span class="debt-amount positive">£${otherOwesPerson.toFixed(2)}</span>
                        </li>
                    `;
                    totalDue += otherOwesPerson;
                }
            });
            
            const netBalance = totalDue - totalOwed;
            
            if (netBalance === 0 && totalOwed === 0 && totalDue === 0) {
                html += '<li class="debt-item">All settled up! ✅</li>';
            }
            
            html += '</ul>';
            
            if (Math.abs(netBalance) > 0.01) {
                const netClass = netBalance > 0 ? 'positive' : 'negative';
                const netText = netBalance > 0 ? 'Net Balance (you receive)' : 'Net Balance (you pay)';
                html += `
                    <div class="total-section">
                        <span>${netText}:</span>
                        <span class="debt-amount ${netClass}">£${Math.abs(netBalance).toFixed(2)}</span>
                    </div>
                `;
            } else if (totalOwed > 0 || totalDue > 0) {
                html += `
                    <div class="total-section">
                        <span>Net Balance:</span>
                        <span class="debt-amount">£0.00 (balanced)</span>
                    </div>
                `;
            }
            
            document.getElementById('personalView').innerHTML = html;
        }

        function populateDropdown() {
            const select = document.getElementById('personSelect');
            
            names.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
            
            select.addEventListener('change', (e) => {
                renderPersonalView(e.target.value);
            });
        }

        async function loadData() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('content').style.display = 'none';
                document.getElementById('error').style.display = 'none';
                
                const [expenses, payments] = await Promise.all([
                    fetchSheetData('Expenses'),
                    fetchSheetData('Payments')
                ]);
                
                parseExpenses(expenses);
                parsePayments(payments);
                calculateOwedMatrix();
                
                populateDropdown();
                renderMatrix();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                document.getElementById('lastUpdated').textContent = 
                    `Last updated: ${new Date().toLocaleString()}`;
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 
                    `Error loading data: ${error.message}. Make sure the Google Sheet is shared publicly (view-only).`;
            }
        }

        // Load data on page load
        loadData();
    </script>
</body>
</html>
